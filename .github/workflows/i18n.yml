name: Lingo.dev i18n

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Translation scope to run
        required: true
        default: all
        type: choice
        options:
          - all
          - ui
          - docs

permissions:
  contents: write
  pull-requests: write

jobs:
  i18n-ui:
    name: Run i18n for shared UI catalogs
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'ui'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: lingodotdev/lingo.dev@95e2e284805c9151c2d3691489c0528f97e72e5e # main
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-key: ${{ secrets.LINGODOTDEV_API_KEY }}
          pull-request: true
          pull-request-title: "i18n: Lingo (ui)"
          commit-message: "i18n: Lingo Translation Update (ui)"
          working-directory: "packages/i18n"
          parallel: true

  i18n-docs:
    name: Run i18n for docs content
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'docs'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: lingodotdev/lingo.dev@95e2e284805c9151c2d3691489c0528f97e72e5e # main
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-key: ${{ secrets.LINGODOTDEV_API_KEY }}
          pull-request: true
          pull-request-title: "i18n: Lingo (docs)"
          commit-message: "i18n: Lingo Translation Update (docs)"
          working-directory: "apps/docs"
          parallel: true
