name: Generate LLMs.txt

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    # Run every 7 days at 2:03 AM UTC
    - cron: '3 2 */7 * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-llms-txt:
    name: Generate LLMs.txt file
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Generate LLMs.txt
        run: |
          python llmtxt-generator.py
          echo "LLMs.txt file generated"


      - name: Create Pull Request
        uses: step-security/create-pull-request@e604d57b37b404d8bb34d152fa905e45d003a895 # v8.1.0
        with:
          branch-token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          commit-message: "Update LLMs.txt via automated workflow"
          title: "Update LLMs.txt file"
          body: 'Auto-generated PR from daily feature gates check'
          branch: "automated-llms-txt-update"
          base: main
          maintainer-can-modify: true
          delete-branch: true
